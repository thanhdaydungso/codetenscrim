<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Gửi logo đội</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/ui.css?v=20261017-6"><link rel="stylesheet" href="/logo-submit.css"></head>
<body><main class="container logo-submit"><section class="panel"><span class="eyebrow">LOGO ĐỘI</span><h1 id="boardTitle">Gửi logo đội</h1><p>Chọn đội chưa có logo rồi gửi ảnh. Logo đã gán sẽ được giữ nguyên.</p><p id="shareStatus" role="status" aria-live="polite">Đang tải bảng…</p>
<form id="logoForm" hidden><label for="teamSlot">Đội của bạn</label><select id="teamSlot" required></select><label for="logoFile">Logo PNG, JPG hoặc WebP</label><input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp" required><img id="logoPreview" alt="Xem trước logo sẽ gửi" hidden><button id="sendLogo" type="submit" class="button primary">Gửi logo</button></form><button id="refreshShare" type="button" class="button secondary">Tải lại bảng</button><h2>Danh sách đội</h2><ul id="shareTeams"></ul></section></main><script src="/logo-submit.js"></script></body></html>
