<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Cổng đăng ký code tên cho giải đấu Free Fire.">
  <title>Cổng quản lý code tên</title>
  <link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/ui.css?v=20261017-7"><script src="/ui.js?v=20261017-7" defer></script></head>
<body class="home-page">
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/" aria-label="Trang chủ">
        <span class="brand-mark">FF</span>
        <span><b id="siteName">CỔNG QUẢN LÝ CODE TÊN</b></span>
      </a>
      <nav class="nav-actions" aria-label="Điều hướng chính">
        <a class="button secondary active" href="/">TRANG CHỦ</a>
        <a class="button primary" href="/admin">BTC ĐĂNG NHẬP</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero container"><canvas id="heroSculpture" aria-hidden="true"></canvas><div class="hero-copy"><span class="eyebrow hero-kicker">FREE FIRE / CUSTOM</span>

      <a class="button primary hero-action" href="#customDirectory">Chọn custom ngay <span aria-hidden="true">↓</span></a><div class="hero-stats" aria-label="Thống kê">
        <div><b id="customCount">—</b><span>Custom</span></div>
        <div><b id="openCount">—</b><span>Đang mở</span></div>
        <div><b id="memberCapacity">—</b><span>Thành viên / đội</span></div>
      </div>
      </div>
    </section>

    <section id="customDirectory" class="container section-space">
      <div class="section-heading">
        <div><span class="eyebrow">[ 01 / CUSTOM ]</span><h2>CHỌN CUSTOM</h2></div>
      </div>
      <div class="browse-tools"><div class="search-field"><label for="customSearch">Tìm custom</label><input id="customSearch" type="search" placeholder="Nhập tên custom…" autocomplete="off"></div><div class="filter-tabs" role="group" aria-label="Lọc custom"><button type="button" data-status-filter="all" aria-pressed="true">Tất cả</button><button type="button" data-status-filter="open" aria-pressed="false">Đang mở</button><button type="button" data-status-filter="full" aria-pressed="false">Đã đầy</button><button type="button" data-status-filter="locked" aria-pressed="false">Đã khóa</button></div><span id="searchSummary" class="muted" role="status"></span></div><div id="notice" class="notice" role="status"></div>
      <div id="customList" class="custom-grid" aria-live="polite">
        <div class="loading-card">Đang tải danh sách custom…</div>
      </div>
    </section>
  </main>


  <script src="/app.js" defer></script>
</body>
</html>
